[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
verbosity = 2
fuzz = { runs = 256 }

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL_PRIMARY}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
