[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
[fuzz]
runs = 256
[invariant]
runs = 128
depth = 32
fail_on_revert = false
